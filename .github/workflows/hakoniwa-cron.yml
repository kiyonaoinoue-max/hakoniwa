name: Hakoniwa LINE定時通知

on:
  schedule:
    # UTC 22:00 = JST 07:00 → 朝の挨拶＋占い＋天気
    - cron: '0 22 * * *'
    # UTC 02:30 = JST 11:30 → 昼食メニュー提案
    - cron: '30 2 * * *'
    # UTC 03:30 = JST 12:30 → 昼食何食べたか質問
    - cron: '30 3 * * *'
    # UTC 09:00 = JST 18:00 → 夕方おすすめ
    - cron: '0 9 * * *'
    # UTC 11:30 = JST 20:30 → ハコさんの質問・学びタイム
    - cron: '30 11 * * *'
    # UTC 毎時30分 = リマインダーチェック（1時間ごと）
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      type:
        description: '通知タイプ (morning/meal_suggest/meal_ask/evening/curiosity/reminder)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - meal_suggest
          - meal_ask
          - evening
          - curiosity
          - reminder

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 通知タイプを判定（実際の日本時間JSTベースで遅延誤爆を防止）
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          else
            JST_HOUR=$(TZ=Asia/Tokyo date +%-H)
            JST_MIN=$(TZ=Asia/Tokyo date +%-M)
            echo "Current JST: ${JST_HOUR}:${JST_MIN} (scheduled cron: ${{ github.event.schedule }})"

            if [ "$JST_HOUR" -ge 6 ] && [ "$JST_HOUR" -le 9 ]; then
              echo "type=morning" >> $GITHUB_OUTPUT
            elif [ "$JST_HOUR" -eq 11 ] || { [ "$JST_HOUR" -eq 12 ] && [ "$JST_MIN" -lt 15 ]; }; then
              echo "type=meal_suggest" >> $GITHUB_OUTPUT
            elif { [ "$JST_HOUR" -eq 12 ] && [ "$JST_MIN" -ge 15 ]; } || [ "$JST_HOUR" -eq 13 ] || { [ "$JST_HOUR" -eq 14 ] && [ "$JST_MIN" -le 30 ]; }; then
              echo "type=meal_ask" >> $GITHUB_OUTPUT
            elif [ "$JST_HOUR" -ge 17 ] && [ "$JST_HOUR" -le 19 ]; then
              echo "type=evening" >> $GITHUB_OUTPUT
            elif [ "$JST_HOUR" -ge 20 ] && [ "$JST_HOUR" -le 22 ]; then
              echo "type=curiosity" >> $GITHUB_OUTPUT
            else
              echo "type=reminder" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Hakoniwa通知を送信
        run: |
          echo "Sending notification type: ${{ steps.type.outputs.type }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.HAKONIWA_API_URL }}/api/cron/notify?type=${{ steps.type.outputs.type }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "Response: $RESPONSE"
          
          # リマインダーも毎回ついでにチェックする（主通知がreminder以外のとき）
          if [ "${{ steps.type.outputs.type }}" != "reminder" ]; then
            curl -s -o /dev/null -X POST "${{ secrets.HAKONIWA_API_URL }}/api/cron/notify?type=reminder" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" || true
          fi

          if [ "$RESPONSE" != "200" ]; then
            echo "⚠️ 通知送信に失敗しました (HTTP $RESPONSE)"
            if [ "${{ steps.type.outputs.type }}" != "reminder" ] && [ "$RESPONSE" != "204" ]; then
              exit 1
            fi
          fi
